app:
  name: Captcha Generator
  description: A simple Tkinter-based GUI app to generate secure random CAPTCHAs.
  version: 1.0.0
  author: Your Name
  license: MIT

dependencies:
  - python>=3.6
  - tkinter
  - pyperclip

features:
  - GUI interface with Tkinter
  - Customizable CAPTCHA length
  - Includes upper/lowercase letters, digits, and punctuation
  - One-click CAPTCHA generation
  - Clipboard copy functionality

settings:
  window:
    width: 400
    height: 300
    resizable: false
    title: "PYTHON PROJECT - CAPTCHA GENERATOR"

  captcha:
    min_length: 6
    max_length: 30
    default_length: 6
    include:
      - uppercase
      - lowercase
      - digits
      - punctuation

commands:
  - GENERATE CAPTCHA
  - COPY TO CLIPBOARD
